<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route Simulator</title>
  <link rel="icon" href="data:,">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>
  <aside class="panel">
    <header class="panel-head">
      <h1>Route Simulator</h1>
      <p>Click the map to add waypoints.</p>
    </header>

    <section class="readout" aria-live="polite">
      <div class="stat">
        <span>Status</span>
        <strong id="status" data-state="idle">Idle</strong>
      </div>
      <div class="stat">
        <span>Speed</span>
        <strong id="speed-readout">—</strong>
      </div>
      <div class="progress">
        <div class="progress-meta">
          <span>Progress</span>
          <strong id="progress-readout">— / —</strong>
        </div>
        <div
          id="progress-track"
          class="track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-label="Route progress"
        >
          <div id="progress-bar"></div>
        </div>
      </div>
    </section>

    <section class="block">
      <div class="block-label">
        <label for="route-text">Route</label>
        <span id="point-count">0 points</span>
      </div>
      <textarea
        id="route-text"
        rows="6"
        spellcheck="false"
        placeholder="One lat,lng per line, or a GeoJSON LineString"
      ></textarea>
      <div class="actions">
        <button type="button" id="apply" class="primary">Apply</button>
        <button type="button" id="undo" disabled>Undo</button>
        <button type="button" id="clear" disabled>Clear</button>
      </div>
    </section>

    <section class="block">
      <label for="speed">Speed (km/h)</label>
      <input id="speed" type="number" min="0" step="1" value="50" inputmode="decimal">
      <label class="check">
        <input id="loop" type="checkbox">
        <span>Loop</span>
      </label>
      <div class="actions">
        <button type="button" id="play" class="go">Play</button>
        <button type="button" id="pause" class="hold">Pause</button>
        <button type="button" id="reset">Reset</button>
      </div>
    </section>

    <p id="message" class="message" role="status"></p>
    <p id="link" class="notice" role="status" hidden></p>
  </aside>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>
