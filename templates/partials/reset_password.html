<div class="auth-card">
  <h2>Set a new password</h2>
  <p class="muted">Your email is verified. Choose a new password of at least 8 characters, then you will be signed in.</p>
  {% if error %}
    <div class="banner error">{{ error }}</div>
  {% endif %}
  <form class="auth-form"
        action="/login/forgot/password"
        method="post"
        hx-post="/login/forgot/password"
        hx-target="#auth-main"
        hx-push-url="false"
        hx-disabled-elt="find .primary">
    <input type="hidden" name="next" value="{{ next_path or '/' }}">
    <label>
      New password
      <input name="password" type="password" autocomplete="new-password" required minlength="8">
    </label>
    <button type="submit" class="primary">
      <span class="btn-idle">Save and sign in</span>
      <span class="btn-busy"><i class="btn-spinner" aria-hidden="true"></i>Saving…</span>
    </button>
  </form>
  <p class="hint">
    <a href="/login" class="text-link"
       hx-get="/login" hx-target="#auth-main" hx-push-url="true">Back to sign in</a>
  </p>
</div>
