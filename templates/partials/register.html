<div class="auth-card">
  <h2>Create account</h2>
  <p class="auth-purpose">Use your work email. We email a 6-digit code to finish setup. Password must be at least 8 characters.</p>
  {% if error %}
    <div class="banner error">{{ error }}</div>
  {% endif %}
  <form class="auth-form"
        action="/register"
        method="post"
        hx-post="/register"
        hx-target="#auth-main"
        hx-push-url="true"
        hx-disabled-elt="find .primary">
    <label>
      Email
      <input name="email" type="email" autocomplete="username" required value="{{ email or username or '' }}">
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="new-password" required minlength="8">
    </label>
    <button type="submit" class="primary">
      <span class="btn-idle">Email me a code</span>
      <span class="btn-busy"><i class="btn-spinner" aria-hidden="true"></i>Sending code…</span>
    </button>
  </form>
  <p class="hint">
    By creating an account you agree to the
    <a href="/terms" class="text-link">Terms</a> and
    <a href="/privacy" class="text-link">Privacy policy</a>.
  </p>
  <p class="hint">
    Already registered?
    <a href="/login" class="text-link"
       hx-get="/login" hx-target="#auth-main" hx-push-url="true">Sign in</a>
  </p>
</div>
