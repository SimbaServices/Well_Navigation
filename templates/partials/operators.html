{% if operators %}
  <ul class="suggest">
    {% for op in operators %}
      <li>
        <form action="/search" method="get"
              hx-get="/search"
              hx-target="#results"
              hx-include="#search-form"
              hx-push-url="true"
              hx-indicator="#spinner">
          <input type="hidden" name="add_op_number" value="{{ op.number }}">
          <input type="hidden" name="add_op_name" value="{{ op.name }}">
          <input type="hidden" name="mode" value="operator">
          <button type="submit" class="suggest-item">
            <strong>{{ op.name }}</strong>
            {% if op.number and op.number != op.name %}
              <span class="muted">#{{ op.number }}</span>
            {% endif %}
          </button>
        </form>
      </li>
    {% endfor %}
  </ul>
{% elif query %}
  <p class="hint">No operators match “{{ query }}”.</p>
{% endif %}
