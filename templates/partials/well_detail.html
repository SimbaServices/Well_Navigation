<div class="map-chrome">
  <div class="map-head">
    <div>
      <h2 id="map-title">{{ well.well_name }}</h2>
      <p id="map-sub" class="muted"></p>
    </div>
    <div class="map-actions">
      {% with variant='detail' %}{% include 'partials/save_button.html' %}{% endwith %}
      <label class="basemap-picker">
        Base layer
        <select id="basemap-select" hx-on:change="setBasemap(this.value)">
          <option value="imagery">Esri Imagery</option>
          <option value="streets">Esri Streets</option>
          <option value="topo">Esri Topo</option>
          <option value="osm">OpenStreetMap</option>
          <option value="usgs">USGS Topo</option>
        </select>
      </label>
      <span class="overlay-with-tip">
        <label class="overlay-toggle"><input type="checkbox" id="pipeline-toggle" checked> Pipelines</label>
        <span class="info-tip">
          <button type="button" class="info-tip-btn" aria-expanded="false" aria-label="Pipeline colors">i</button>
          <span class="info-tip-pop" popover="manual" hidden role="tooltip">
            <span class="legend-key">
              <span><i class="swatch gas"></i>Gas</span>
              <span><i class="swatch crude"></i>Crude</span>
              <span><i class="swatch hvl"></i>HVL</span>
              <span><i class="swatch product"></i>Product</span>
              <span><i class="swatch other"></i>Other</span>
            </span>
          </span>
        </span>
      </span>
      <label class="overlay-toggle"><input type="checkbox" id="disposal-toggle"> Waste sites</label>
    </div>
  </div>

  <div id="well-map"
       class="well-map"
       data-api="{{ well.api }}"
       data-state="{{ well.state or 'tx' }}"
       data-name="{{ well.well_name }}"
       data-label="{{ well.well_name }}"
       data-lease="{{ well.lease_name }}"
       data-county="{{ well.county }}"
       data-operator="{{ well.operator }}"
       data-status="{{ well.status_label or '' }}"
       {% if location.found and location.wellhead %}
       data-lat="{{ location.wellhead.lat }}"
       data-lon="{{ location.wellhead.lon }}"
       {% if location.toe %}
       data-toe-lat="{{ location.toe.lat }}"
       data-toe-lon="{{ location.toe.lon }}"
       {% endif %}
       {% endif %}></div>

  <p id="pipeline-status" class="muted pipeline-status"></p>
  <div id="pipeline-owners" class="pipeline-owners" hidden></div>

  <ul id="mapped-list" class="mapped-list"></ul>

  <div class="map-footer">
    <div id="map-coords" class="coord-bar"></div>
    <div id="nav-links" class="route-row"></div>
  </div>
</div>
