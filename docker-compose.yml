# Hosted defaults. Local `docker compose up` also loads docker-compose.override.yml.
services:
  web:
    build: .
    image: wellnav:latest
    container_name: wellnav
    command: uvicorn app:app --host 0.0.0.0 --port 5050 --workers 2
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - wellnav-data:/app/data
    environment:
      TZ: America/Chicago
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  wellnav-data:
